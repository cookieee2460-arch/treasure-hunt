<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Treasure Hunt</title>

<style>
:root {
  --bg:#ffffff; --text:#111; --card:#f3f4f6;
  --btn:#2563eb; --error:#dc2626; --hint:#047857;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0f172a; --text:#e5e7eb; --card:#1e293b;
    --btn:#3b82f6; --error:#f87171; --hint:#34d399;
  }
}
body {
  margin:0; min-height:100vh;
  display:flex; justify-content:center; align-items:center;
  background:var(--bg); color:var(--text);
  font-family:system-ui, sans-serif; padding:16px;
}
.card {
  width:100%; max-width:420px;
  background:var(--card); padding:22px;
  border-radius:16px; text-align:center;
  box-shadow:0 20px 45px rgba(0,0,0,.2);
}
input, button {
  width:100%; padding:12px; margin-top:12px;
  border-radius:10px; border:none; font-size:1rem;
}
button { background:var(--btn); color:white; cursor:pointer; }
button.secondary {
  background:transparent; border:1px solid var(--btn); color:var(--btn);
}
.message { margin-top:10px; font-size:.95rem; }
.error { color:var(--error); }
.hint { color:var(--hint); }
.hidden { display:none; }
.shake { animation:shake .35s; }
@keyframes shake {
  0%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  50%{transform:translateX(6px)}
  75%{transform:translateX(-6px)}
  100%{transform:translateX(0)}
}
</style>
</head>

<body>

<div class="card" id="card">
  <h2 id="title">🔐 Clue 1</h2>
  <p id="clue"></p>

  <input id="input" placeholder="Enter answer">
  <button onclick="check()">Submit</button>
  <button class="secondary" onclick="hint()">Use Lifeline</button>

  <div id="msg" class="message error hidden">Wrong answer. Try again.</div>
  <div id="hintMsg" class="message hint hidden"></div>
  <div class="message">Lifelines left: <span id="lives">3</span></div>
</div>

<script>
let level = 0;
let lifelines = 3;
let hintIndex = 0;

const game = [
{
  clue:"I'm cold inside but not outside. I guard your food with humming pride.",
  answer:"fridge",
  hints:["It's in the kitchen","Keeps food fresh","Opens with a pull"]
},
{
  clue:"Unscramble this word: R R O M I R",
  answer:"mirror",
  hints:["You already use it daily","You see yourself","It reflects"]
},
{
  clue:"I wait for you when you're tired. You lie on me, dreams required.",
  answer:"bed",
  hints:["Bedroom item","You sleep here","Has pillows"]
},
{
  clue:"I open with a pull, I hide your things. Not a door, but close to one.",
  answer:"drawer",
  hints:["Furniture part","Stores items","Slides out"]
},
{
  clue:"Solve: 9 × 2 − 3",
  answer:"15",
  hints:["Multiply first","Then subtract","Two digits"]
},
{
  clue:"I hold stories but cannot speak. I travel minds week to week.",
  answer:"bookshelf",
  hints:["Has many books","Wood or metal","In living room"]
},
{
  clue:"People gather here to eat and talk. I stand still and never walk.",
  answer:"table",
  hints:["Furniture","Used daily","Flat surface"]
},
{
  clue:"I tell time but make no sound. I hang or stand, always around.",
  answer:"clock",
  hints:["Shows hours","Has hands","Tick-tock"]
},
{
  clue:"I'm in the kitchen, hot or cold. I help you cook what you'll hold.",
  answer:"oven",
  hints:["Kitchen appliance","Used for baking","Gets hot"]
},
{
  clue:"I hold your clothes, neat and tall. Open me to find outfits for all.",
  answer:"wardrobe",
  hints:["Bedroom storage","Big cupboard","Has hangers"]
}
];

function load() {
  document.getElementById("title").innerText = `🔐 Clue ${level+1}`;
  document.getElementById("clue").innerText = game[level].clue;
  document.getElementById("input").value = "";
  document.getElementById("msg").classList.add("hidden");
  document.getElementById("hintMsg").classList.add("hidden");
}
load();

function check() {
  const val = input.value.trim().toLowerCase();
  if (val === game[level].answer) {
    level++;
    hintIndex = 0;
    if (level === game.length) {
      document.body.innerHTML =
      "<h1>🎉 SURPRISE 🎉<br>Happy Birthday!! 💖</h1>";
    } else load();
  } else {
    msg.classList.remove("hidden");
    card.classList.add("shake");
    setTimeout(()=>card.classList.remove("shake"),350);
  }
}

function hint() {
  if (lifelines === 0) {
    hintMsg.innerText = "No lifelines left.";
    hintMsg.classList.remove("hidden");
    return;
  }
  hintMsg.innerText = game[level].hints[hintIndex] || "No more hints for this clue.";
  hintMsg.classList.remove("hidden");
  hintIndex++;
  lifelines--;
  document.getElementById("lives").innerText = lifelines;
}
</script>

</body>
</html>
